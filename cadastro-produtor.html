<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroFeira - Cadastro Produtor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link   rel="stylesheet" href="reset.css">
    <link   rel="stylesheet" href="tokens.css">
    <link   rel="stylesheet" href="estilo.css">
</head>

<body>

    <a href="#conteudo" class="pular">Pular para o conteúdo</a>

    <!-- Cabeçalho -->
    <header class="cabecalho-site">
        <h1>AgroFeira Cadastro Produtor</h1>

        <nav aria-label="Principal" class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="safra.html">Safra</a></li>
                <li><a href="cadastro-produtor.html" aria-current="page">Cadastro</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main id="conteudo">

        <h2>Cadastro de produtor</h2>

        <form class="fomulario-cadastro">

            <!-- Primeiro grupo -->
            <fieldset>
                <legend>Quem é você</legend>

                <p>
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required
                    >
                </p>

                <p>
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </p>

                <p>
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        autocomplete="tel"
                    >
                </p>

                <p>
                    <label for="caf">Número do CAF</label>
                    <input
                        type="text"
                        id="caf"
                        name="caf"
                    >
                </p>

                <p>
                    <label for="cep">CEP da propriedade</label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        inputmode="numeric"
                        pattern="[0-9]{5}-?[0-9]{3}"
                        aria-describedby="ajuda-cep"
                        required
                    >

                    <small id="ajuda-cep">
                        Digite cinco números, hífen opcional e mais três números.
                    </small>
                </p>

            </fieldset>


            <!-- Segundo grupo -->
            <fieldset>
                <legend>O que você vende</legend>

                <p>
                    <label for="produto">Produto principal</label>

                    <select
                        id="produto"
                        name="produto"
                        required
                    >
                        <option value="">Escolha um produto</option>
                        <option value="mandioca">Mandioca</option>
                        <option value="banana-prata">Banana-prata</option>
                        <option value="acai">Açaí</option>
                        <option value="pimenta-do-reino">Pimenta-do-reino</option>
                        <option value="cupuacu">Cupuaçu</option>
                        <option value="alface">Alface</option>
                    </select>
                </p>

                <p>
                    <label for="quantidade">Quantidade por semana</label>

                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="1"
                        max="500"
                        step="1"
                        required
                    >
                </p>

                <p>
                    <label for="data-entrega">Começa a entregar em</label>

                    <input
                        type="date"
                        id="data-entrega"
                        name="data-entrega"
                    >
                </p>

                <fieldset>
                    <legend>Como entrega</legend>

                    <input
                        type="radio"
                        id="leva-feira"
                        name="entrega"
                        value="leva-feira"
                    >
                    <label for="leva-feira">Leva à feira</label>

                    <input
                        type="radio"
                        id="retira-propriedade"
                        name="entrega"
                        value="retira-propriedade"
                    >
                    <label for="retira-propriedade">
                        A feira retira na propriedade
                    </label>
                </fieldset>

                <p>
                    <label for="observacao">Observação</label>

                    <textarea
                        id="observacao"
                        name="observacao"
                        rows="4"
                    ></textarea>
                </p>

                <p>
                    <input
                        type="checkbox"
                        id="aceite"
                        name="aceite"
                        required
                    >
                    <label for="aceite">Aceito as regras</label>
                </p>

            </fieldset>

            <button type="submit">Enviar</button>

        </form>

        <p role="status" aria-live="polite"></p>

    </main>

    <!-- Rodapé -->
    <footer class="rodape-site">
        <p>AgroFeira - Html idealizado por Leonnardo Lair</p>
    </footer>

</body>

</html>
